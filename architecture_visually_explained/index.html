<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio architecture</title>
    <meta name="description" content="How the portfolio's public site, admin panel, backend and database fit together." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Pick the saved theme (or the system's) before anything paints.
      try {
        const saved = localStorage.getItem("arch-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="Portfolio architecture, start">
        <img class="brand-mark" src="favicon.svg" width="30" height="30" alt="" />
        <span class="brand-text"><strong>Portfolio architecture</strong><small>the whole system, visually</small></span>
      </a>
      <nav class="tabs" aria-label="Views">
        <a href="#overview" data-view="overview" title="System">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2.5" /><circle cx="19" cy="6" r="2.5" /><circle cx="12" cy="18" r="2.5" /><path d="M7.5 6h9M6.4 8.3l4.3 7.4M17.6 8.3l-4.3 7.4" /></svg>
          <span class="tab-label">System</span>
        </a>
        <a href="#backend" data-view="backend" title="Backend">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2" /><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M7 7.5h.01M7 16.5h.01" /></svg>
          <span class="tab-label">Backend</span>
        </a>
        <a href="#frontends" data-view="frontends" title="Frontends">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01" /></svg>
          <span class="tab-label">Frontends</span>
        </a>
        <a href="#database" data-view="database" title="Database">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8" /><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8" /></svg>
          <span class="tab-label">Database</span>
        </a>
        <a href="#flows" data-view="flows" title="Flows">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18M19 3v18M5 8h11M13.5 5.5 16 8l-2.5 2.5M19 15H8M10.5 12.5 8 15l2.5 2.5" /></svg>
          <span class="tab-label">Flows</span>
        </a>
      </nav>
      <div class="tools">
        <div class="search">
          <input id="search" type="search" placeholder="Search tables, files, pages…" autocomplete="off" aria-label="Search" />
          <div id="search-results" class="search-results" role="listbox" hidden></div>
        </div>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch light / dark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" /></svg>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <aside id="detail" class="detail" aria-live="polite" hidden>
      <div class="detail-head">
        <div>
          <div id="detail-kicker" class="kicker"></div>
          <h2 id="detail-title"></h2>
        </div>
        <button id="detail-close" class="icon-btn" type="button" aria-label="Close details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div id="detail-body" class="detail-body"></div>
    </aside>

    <footer class="footer">
      Checked against the code on <span id="checked-on"></span>. Facts live in <code>data/*.js</code>; the database part is
      generated from the models (<code>backend/scripts/export_architecture_db.py</code>).
    </footer>

    <script src="data/system.js"></script>
    <script src="data/backend.js"></script>
    <script src="data/frontends.js"></script>
    <script src="data/db-schema.generated.js"></script>
    <script src="data/database.js"></script>
    <script src="data/flows.js"></script>
    <script src="app.js"></script>
  </body>
</html>
